name: Build Windows ROCm HIP

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      gfx_target:
        description: 'GPU architecture target'
        required: false
        default: 'gfx1101'

env:
  GFX_TARGET: ${{ github.event.inputs.gfx_target || 'gfx1101' }}
  UPSTREAM_REPO: 'https://github.com/ciru-ai/ROCmFPX.git'
  HIPSDK_INSTALLER_VERSION: '26.Q1'

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Clone upstream and apply patches
        shell: pwsh
        run: |
          Write-Host "=== Clonando upstream ===" -ForegroundColor Cyan
          git clone ${{ env.UPSTREAM_REPO }} upstream-temp
          
          $patches = Get-ChildItem "patches" -Filter "*.patch" | Sort-Object Name
          Write-Host "Patches: $($patches.Count)" -ForegroundColor Yellow
          
          Set-Location upstream-temp
          foreach ($patch in $patches) {
              $patchPath = "${{ github.workspace }}\patches\$($patch.Name)"
              Write-Host "Aplicando: $($patch.Name)" -ForegroundColor Green
              git apply --check $patchPath 2>&1
              git apply $patchPath 2>&1
          }
          Set-Location "${{ github.workspace }}"
          
          # Copiar upstream para cima do fork
          $items = Get-ChildItem upstream-temp -Force
          foreach ($item in $items) {
              if ($item.Name -eq ".git" -or $item.Name -eq "patches") { continue }
              $dest = Join-Path "${{ github.workspace }}" $item.Name
              if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
              Copy-Item $item.FullName $dest -Recurse -Force
          }
          Remove-Item upstream-temp -Recurse -Force
          Write-Host "=== Pronto ===" -ForegroundColor Cyan

      - name: Use ROCm Installation Cache
        uses: actions/cache@v5
        id: cache-rocm
        with:
          path: C:\Program Files\AMD\ROCm
          key: cache-rocm-${{ env.HIPSDK_INSTALLER_VERSION }}-${{ runner.os }}

      - name: Setup ROCm
        if: steps.cache-rocm.outputs.cache-hit != 'true'
        uses: ./.github/actions/windows-setup-rocm
        with:
          version: ${{ env.HIPSDK_INSTALLER_VERSION }}

      - name: Verify ROCm
        run: |
          $clangPath = Get-ChildItem 'C:\Program Files\AMD\ROCm\*\bin\clang.exe' | Select-Object -First 1
          if (-not $clangPath) { throw "ROCm not found" }
          & $clangPath.FullName --version

      - name: Setup Ninja
        run: choco install ninja -y

      - name: Build
        shell: pwsh
        run: |
          $env:HIP_PATH = (Resolve-Path 'C:\Program Files\AMD\ROCm\*\bin\clang.exe' | Split-Path | Split-Path)
          $env:CMAKE_PREFIX_PATH = $env:HIP_PATH
          
          Write-Host "HIP Path: $env:HIP_PATH" -ForegroundColor Cyan
          Write-Host "Target: ${{ env.GFX_TARGET }}" -ForegroundColor Cyan
          
          cmake -G "Unix Makefiles" -B build -S . `
            -DCMAKE_C_COMPILER="$env:HIP_PATH\bin\clang.exe" `
            -DCMAKE_CXX_COMPILER="$env:HIP_PATH\bin\clang++.exe" `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_HIP=ON `
            -DGGML_HIP_FORCE_MMQ=ON `
            -DGGML_VULKAN=OFF `
            -DGGML_CUDA=OFF `
            -DGPU_TARGETS="${{ env.GFX_TARGET }}" `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_WEBUI=OFF `
            -DLLAMA_BUILD_TESTS=OFF
          
          cmake --build build -j ${env:NUMBER_OF_PROCESSORS}
          Write-Host "Build OK" -ForegroundColor Green

      - name: Package
        shell: pwsh
        run: |
          $archive = "ROCmFPX-windows-x64-${{ env.GFX_TARGET }}.zip"
          Compress-Archive -Path "build\bin\*.exe", "build\bin\*.dll" -DestinationPath $archive
          Write-Host "Archive: $archive" -ForegroundColor Green

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROCmFPX-Windows-${{ env.GFX_TARGET }}
          path: ROCmFPX-windows-*.zip
          retention-days: 90

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Build Windows ROCm (${{ env.GFX_TARGET }})"
          body: |
            Build automático do ROCmFPX para Windows com ROCm/HIP.
            
            **GPU Target:** ${{ env.GFX_TARGET }}
            **ROCm Version:** 26.Q1 (7.1.1)
            **Commit:** ${{ github.sha }}
            
            ### Como usar
            1. Baixe o ZIP
            2. Extraia em uma pasta
            3. Execute `llama-server.exe` ou `llama-cli.exe`
            
            **IMPORTANTE:** NÃO defina `GGML_HIP_ENABLE_UNIFIED_MEMORY=1`
          files: ROCmFPX-windows-*.zip
          draft: false
          prerelease: false
